<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="Layered shield: perimeter drop, mesh authentication, and audited exceptions defending the host">
  <defs>
    <linearGradient id="shbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="260" fill="url(#shbg)"/>
  <text x="450" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#7ee787" letter-spacing="2">// SECURITY MODEL — LAYERED, NOT SINGLE-POINT</text>

  <!-- concentric shield rings -->
  <g transform="translate(160,60)">
    <path d="M90 0 L172 26 V96 C172 148 136 182 90 198 C44 182 8 148 8 96 V26 Z" fill="url(#shieldFill)" stroke="#3fb950" stroke-width="2" opacity="0.9"/>
    <path d="M90 28 L146 46 V96 C146 132 122 156 90 168 C58 156 34 132 34 96 V46 Z" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.6"/>
    <path d="M62 96 L84 118 L120 74" fill="none" stroke="#7ee787" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shglow)"/>
    <text x="90" y="214" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b949e">perimeter: policy drop</text>
  </g>

  <!-- threat rows -->
  <g font-family="JetBrains Mono, monospace" font-size="12.5">
    <g transform="translate(400,64)">
      <circle cx="0" cy="0" r="4" fill="#f85149"/>
      <text x="14" y="4" fill="#e6edf3">port scan / enumeration</text>
      <text x="330" y="4" fill="#7ee787" text-anchor="end">-> silence</text>
    </g>
    <g transform="translate(400,94)">
      <circle cx="0" cy="0" r="4" fill="#f85149"/>
      <text x="14" y="4" fill="#e6edf3">SYN flood / XMAS / NULL scan</text>
      <text x="330" y="4" fill="#7ee787" text-anchor="end">-> dropped + logged</text>
    </g>
    <g transform="translate(400,124)">
      <circle cx="0" cy="0" r="4" fill="#f85149"/>
      <text x="14" y="4" fill="#e6edf3">spoofed source inside tunnel</text>
      <text x="330" y="4" fill="#7ee787" text-anchor="end">-> dual-checked</text>
    </g>
    <g transform="translate(400,154)">
      <circle cx="0" cy="0" r="4" fill="#f85149"/>
      <text x="14" y="4" fill="#e6edf3">WireGuard handshake flood</text>
      <text x="330" y="4" fill="#7ee787" text-anchor="end">-> per-source meter</text>
    </g>
    <g transform="translate(400,184)">
      <circle cx="0" cy="0" r="4" fill="#e8b339"/>
      <text x="14" y="4" fill="#e6edf3">compromised mesh peer</text>
      <text x="330" y="4" fill="#e8b339" text-anchor="end">-> out of scope*</text>
    </g>
    <g transform="translate(400,214)">
      <circle cx="0" cy="0" r="4" fill="#e8b339"/>
      <text x="14" y="4" fill="#e6edf3">application-layer exploits</text>
      <text x="330" y="4" fill="#e8b339" text-anchor="end">-> out of scope*</text>
    </g>
  </g>
  <text x="400" y="246" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#4d5f59">* L3/L4 firewall — pair with per-peer rules and a WAF for full coverage</text>
</svg>
